<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <text x="30" y="40" fill="#f8fafc" font-size="22" font-weight="bold">Deployment Lifecycle &amp; Context Assertion Flow</text>
  <text x="30" y="62" fill="#94a3b8" font-size="14">How 'make up' safely switches contexts and asserts targets before applying manifests</text>

  <!-- Flow Chart Blocks -->
  
  <!-- Step 1: User Command -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="15" y="30" fill="#f8fafc" font-size="14" font-weight="bold">1. User Runs</text>
    <rect x="15" y="40" width="130" height="28" rx="4" fill="#0f172a"/>
    <text x="25" y="58" fill="#38bdf8" font-size="12" font-mono="true">make up</text>
  </g>

  <!-- Arrow -->
  <path d="M 200 150 L 240 150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Context Switch -->
  <g transform="translate(240, 110)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="15" y="30" fill="#a5b4fc" font-size="14" font-weight="bold">2. Switch Context</text>
    <text x="15" y="50" fill="#cbd5e1" font-size="11" font-mono="true">vcluster connect vc-tN</text>
    <text x="15" y="65" fill="#818cf8" font-size="10">(*vc-t2 connects via my-host)</text>
  </g>

  <!-- Arrow -->
  <path d="M 460 150 L 500 150" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 3: Assert Context -->
  <g transform="translate(500, 95)">
    <polygon points="100,0 200,55 100,110 0,55" fill="#854d0e" stroke="#eab308" stroke-width="2"/>
    <text x="50" y="52" fill="#fef08a" font-size="12" font-weight="bold">assert_context</text>
    <text x="45" y="68" fill="#ffffff" font-size="10">Matches current context?</text>
  </g>

  <!-- Arrow Failure -->
  <path d="M 600 150 L 600 240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/>
  <g transform="translate(515, 240)">
    <rect x="0" y="0" width="170" height="60" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
    <text x="15" y="25" fill="#fecdd3" font-size="12" font-weight="bold">❌ REFUSE DEPLOY</text>
    <text x="15" y="42" fill="#ffffff" font-size="10">Exit 1 (Prevents leakage)</text>
  </g>

  <!-- Arrow Success -->
  <path d="M 700 150 L 750 150" stroke="#22c55e" stroke-width="2"/>

  <!-- Step 4: Apply Manifest -->
  <g transform="translate(750, 110)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="30" fill="#a7f3d0" font-size="14" font-weight="bold">4. Safe Deployment</text>
    <text x="15" y="50" fill="#ffffff" font-size="11" font-mono="true">kubectl apply -f *.yml</text>
    <text x="15" y="65" fill="#6ee7b7" font-size="10">Wait for deployment status</text>
  </g>

  <!-- Execution Pipeline Matrix -->
  <rect x="40" y="330" width="910" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="360" fill="#f8fafc" font-size="15" font-weight="bold">'make up' Sequential Sequence:</text>

  <!-- T1 Target -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="270" height="80" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="12" y="22" fill="#34d399" font-size="12" font-weight="bold">Target 1: dep_t1</text>
    <text x="12" y="40" fill="#a7f3d0" font-size="11">Context: vcluster-docker_vc-t1</text>
    <text x="12" y="58" fill="#ffffff" font-size="11">Deploys: nginx -> ns nginx</text>
  </g>

  <!-- T2 Target -->
  <g transform="translate(350, 380)">
    <rect x="0" y="0" width="270" height="80" rx="6" fill="#3b0764" stroke="#a21caf" stroke-width="1"/>
    <text x="12" y="22" fill="#e879f9" font-size="12" font-weight="bold">Target 2: dep_t2</text>
    <text x="12" y="40" fill="#f5d0fe" font-size="11">Context: ...vc-t2...my-host</text>
    <text x="12" y="58" fill="#ffffff" font-size="11">Deploys: redis -> ns redis</text>
  </g>

  <!-- T3 Target -->
  <g transform="translate(640, 380)">
    <rect x="0" y="0" width="270" height="80" rx="6" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
    <text x="12" y="22" fill="#60a5fa" font-size="12" font-weight="bold">Target 3: dep_t3</text>
    <text x="12" y="40" fill="#bfdbfe" font-size="11">Context: vcluster-docker_vc-t3</text>
    <text x="12" y="58" fill="#ffffff" font-size="11">Deploys: postgres -> ns postgres</text>
  </g>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
