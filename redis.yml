# Single-node Redis on the host vCluster, namespaced to `redis`.
#
#   kubectl apply -f redis.yml
#   kubectl -n redis exec deploy/redis -- redis-cli ping
#
# Storage: one RWO PVC on the local-path provisioner (node-pinned). No replica set,
# no Sentinel — this is a dev dependency, not a datastore of record.

apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stacked

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis

---
# A real password. An EMPTY requirepass is not "open but authenticated" — redis
# treats `--requirepass ""` as auth disabled entirely and every AUTH attempt then
# fails with:
#     AUTH failed: ERR AUTH <password> called without any password configured
# which also spams the liveness/readiness probes. Set an actual value.
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  password: stacked_local_dev

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-conf
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no
    appendonly yes
    appendfsync everysec
    dir /data
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate # a PVC cannot be attached by two pods on this provisioner
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: redis
      securityContext:
        fsGroup: 999 # redis image runs as uid 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /etc/redis
          # requirepass is set, so the probe must authenticate too.
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # writes the AOF/RDB into /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: conf
          configMap:
            name: redis-conf

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
